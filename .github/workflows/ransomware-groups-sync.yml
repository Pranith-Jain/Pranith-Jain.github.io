name: Ransomware groups sync (weekly)

# Re-fetches the Ransomlook group list + activity window (+ top-30 group
# profiles for leak-site status) and rebuilds
# public/data/ransomware-groups/. If the data changed, opens a PR for
# human review. Per-request serving stays fully static (env.ASSETS).

on:
  schedule:
    # Wednesdays 06:30 UTC — staggered off the threaticon Tue slot.
    - cron: "30 6 * * 3"
  workflow_dispatch: {}

concurrency:
  group: ransomware-groups-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Sync upstream (group list + activity + top-30 profiles)
        run: node scripts/sync-ransomware-groups.mjs --enrich 30 --concurrency 3

      - name: Build manifest
        run: node scripts/build-ransomware-groups.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data/ransomware-groups/ changed files ==="
          git status --short public/data/ransomware-groups/ | head -40
          echo "=== staging folder size ==="
          du -sh threat-intel-staging/ransomware-groups/ || true

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ti): sync ransomware groups directory"
          title: "Ransomware groups directory sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly sync of the ransomware-groups directory
            (Ransomlook group list + activity, top-30 profiles for status).
            Review the counts in `public/data/ransomware-groups/index.json`, then merge.
          branch: chore/ransomware-groups-sync
          delete-branch: true

      - name: Auto-merge sync PR
        # Data-only output, so it merges itself once checks clear (same
        # pattern as ai-security-verticals-sync.yml). Without this the PR sits
        # open forever and its branch accumulates one ref per run — which is
        # how `etda-actors-sync` and `chore/ransomware-groups-sync` piled up.
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash --delete-branch \
            "${{ steps.pr.outputs.pull-request-number }}"

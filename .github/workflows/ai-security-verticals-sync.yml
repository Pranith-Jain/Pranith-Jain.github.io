name: AI-security verticals sync (weekly)

# Rebuilds the three AI-security verticals from their upstreams:
#   public/data/cairn/   (Cisco-Talos CAIRN: 26 YARA rules, 27 filters,
#                          12 archetypes, 10 family reports — MIT)
#   public/data/nova/    (Nova-Hunting nova-rules: 69 .nov rules + taxonomy — MIT)
#   public/data/denali/  (transilienceai denali: 9 rules, taxonomy, 38 ADRs — Apache-2.0)
# If the data changed, opens a PR and auto-merges it (data-only; main is
# unprotected), then self-deploys so the live site serves the fresh
# manifests. Per-request serving stays fully static (env.ASSETS).

on:
  schedule:
    # Tuesdays 07:30 UTC — staggered off the CTI 07:30-Monday slot.
    - cron: "30 7 * * 2"
  workflow_dispatch: {}

concurrency:
  group: ai-security-verticals-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-fund || npm install --no-fund

      - name: Build CAIRN manifest
        # Raw fetches from Cisco-Talos/CAIRN (yara_rules.yar,
        # acquisition_filters.yaml, 10 family reports).
        continue-on-error: true
        run: node scripts/build-cairn-manifest.mjs

      - name: Build NOVA manifest
        # GitHub tree API + raw fetches from Nova-Hunting/nova-rules (*.nov).
        continue-on-error: true
        run: node scripts/build-nova-manifest.mjs

      - name: Build Denali manifest
        # GitHub tree API + raw fetches from transilienceai/denali (36 ADRs + roadmap).
        # Rule catalog + taxonomy are transcribed in the script (no fetch needed).
        continue-on-error: true
        run: node scripts/build-denali-manifest.mjs

      - name: Show diff stat
        run: |
          echo "=== public/data changed files ==="
          git status --short public/data/cairn/ public/data/nova/ public/data/denali/ | head -40

      - name: Open PR if data changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(ti): sync AI-security verticals (cairn/nova/denali)"
          title: "AI-security verticals sync — ${{ github.event.schedule || 'manual' }}"
          body: |
            Automated weekly rebuild of the three AI-security verticals.
            Each build step is isolated (`continue-on-error`) so one flaky
            upstream never aborts the remaining verticals. The PR is
            auto-merged by the same run (data-only changes; main is
            unprotected), and deploy.yml gates + deploys the merge on main.

            Sources:
            - Cisco-Talos/Cognitive-Artifact-Intelligence-Research-Network (MIT)
            - Nova-Hunting/nova-rules + nova-framework taxonomy (MIT)
            - transilienceai/denali ADRs + roadmap (Apache-2.0)

            Trigger: `${{ github.event_name }}`
            Run:     `${{ github.run_id }}`
          branch: chore/ai-security-verticals-sync
          delete-branch: true
          add-paths: |
            public/data/cairn/
            public/data/nova/
            public/data/denali/

      - name: Auto-merge sync PR
        # Data-only output, main unprotected — merges itself (same pattern
        # as threat-intel-sync.yml).
        id: automerge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}"

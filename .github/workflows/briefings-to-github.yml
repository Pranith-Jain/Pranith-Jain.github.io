name: Export briefings to GitHub

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC daily (after the 00:30 briefing build)
  workflow_dispatch:

concurrency:
  group: briefings-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export briefings from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — skipping briefings export (set it in repo Settings > Secrets to enable)."
            exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID secret is not set — skipping briefings export."
            exit 0
          fi
          # Wipe stale files so briefings beyond the 30-day window are removed.
          rm -rf briefings
          node scripts/export-briefings-to-github.mjs --days 30

      - name: Commit and push briefings to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync PANOPTICON briefings $(date -u +%Y-%m-%d)"
            # Retry a few times — this repo's main moves fast (auto-FF merges).
            for i in 1 2 3; do
              if git pull --rebase origin main 2>/dev/null && git push origin main; then
                echo "::notice::Pushed $(git diff --name-only HEAD~1 HEAD | wc -l) briefing files"
                exit 0
              fi
              sleep 10
            done
            echo "::error::Could not push after 3 attempts (main kept moving)."
            exit 1
          fi

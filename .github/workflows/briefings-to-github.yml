name: Export briefings to GitHub

on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC daily (after the 00:30 briefing build)
  workflow_dispatch:

concurrency:
  group: briefings-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export briefings from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set on this repo."
            echo "Create a Cloudflare API token with D1 read scope (Account > API Tokens > Create Token > Custom) and add it as a repository secret named CLOUDFLARE_API_TOKEN."
            echo "Dashboard: https://dash.cloudflare.com/profile/api-tokens"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set on this repo."
            echo "Find it at https://dash.cloudflare.com/ (right sidebar) and add it as a repository secret named CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          node scripts/export-briefings-to-github.mjs --days 30

      - name: Push to daily-threat-brief repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT secret is not set on this repo."
            echo "Create a fine-grained PAT (or classic PAT with 'repo' scope) at https://github.com/settings/tokens and add it as a repository secret named GH_PAT."
            exit 1
          fi
          # Clone the existing repo and commit exports only under briefings/ so
          # scripts/, workflows/ and history are preserved (NO force push).
          rm -rf /tmp/dtb-sync
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/Pranith-Jain/daily-threat-brief.git" /tmp/dtb-sync
          rm -rf /tmp/dtb-sync/briefings
          mkdir -p /tmp/dtb-sync/briefings
          cp -R briefings-out/. /tmp/dtb-sync/briefings/
          cd /tmp/dtb-sync
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync PANOPTICON briefings $(date -u +%Y-%m-%d)"
            git push origin main
            echo "::notice::Pushed $(git diff --name-only HEAD~1 HEAD | wc -l) files to Pranith-Jain/daily-threat-brief"
          fi

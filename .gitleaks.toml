# Gitleaks config — secret scanning for the pranith-jain-portfolio repo.
#
# Strategy: use gitleaks' default rule set (covers AWS/GCP/Azure/Stripe/Slack/
# GitHub PAT/private keys/generic high-entropy) but allowlist the files that
# legitimately contain key NAMES (not values):
#
#   - .env.example        — every key is an empty string or a placeholder
#   - docs/API_KEYS.md    — documents which providers need keys (names only)
#   - docs/ENVIRONMENT_VARIABLES.md — same
#   - public/data/**      — replicated upstream data (MIT/AGPL), not our secrets
#   - security-investigator-replication/** — upstream SI content (MIT)
#   - signature-base-replication/**       — upstream YARA rules
#   - migrations/**        — D1 schema, no secrets
#   - the two *.generated.ts build outputs, named individually
#   - dist/**, .ssr-build/**, node_modules/** — build artifacts
#
# Every entry is an ANCHORED regex (^...$). An unanchored pattern is a regex
# match anywhere in the path, not a glob, so a bare `\.generated\.` or
# `docs/free/.*` silently exempts far more than it looks like — including any
# new file that happens to land under those names. Anchoring keeps each entry
# scoped to the exact path it was reviewed for, so a real secret committed to
# .env (no extension), a source file, or a new file in an allowlisted
# directory is still caught.

title = "pranith-jain-portfolio secret scan"

[allowlist]
description = "Allowlist files that contain key names or upstream data, not real secrets"
paths = [
  '''\.env\.example$''',
  '''^docs/API_KEYS\.md$''',
  '''^docs/ENVIRONMENT_VARIABLES\.md$''',
  # Named rather than `docs/free/.*`: the whole-directory pattern meant any file
  # dropped in there would skip scanning silently.
  '''^docs/free/sample-scan\.md$''',
  '''public/data/.*''',
  '''security-investigator-replication/.*''',
  '''signature-base-replication/.*''',
  '''migrations/.*''',
  # Build output. Listed as explicit paths, not the `\.generated\.` pattern
  # that was here before: that pattern matched ANY path containing
  # ".generated." anywhere, so a hand-named file or a directory could opt itself
  # out of scanning. Two files currently qualify; adding a third means adding
  # it here, which is the point.
  '''^worker/og-version\.generated\.ts$''',
  '''^api/src/lib/_telegram-actor-catalog\.generated\.ts$''',
  '''dist/.*''',
  '''\.ssr-build/.*''',
  '''node_modules/.*''',
  '''package-lock\.json$''',
  '''skills-lock\.json$''',
  # The .agents/skills/ bundle is vendored ECC content (MIT/CC0 skills), not
  # our code — scanning it just produces noise about example tokens in skill
  # documentation.
  '''\.agents/skills/.*''',
  # Loop/skill docs may quote example env var names.
  '''docs/loops/.*''',
  '''docs/decisions/.*''',
]

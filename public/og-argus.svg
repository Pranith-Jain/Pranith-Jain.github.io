<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Hanken Grotesk', system-ui, sans-serif">
  <!-- Flat: solid bg + accent discs. No gradients/glow/grid — they multiply
       PNG file size (see generate-og-png.mjs header). -->
  <rect width="1200" height="630" fill="#0b1120"/>

  <!-- flat accent glow substitute (top-right) -->
  <circle cx="962" cy="156" r="300" fill="#2c3ee5" opacity="0.10"/>

  <!-- scan-ring motif (right) -->
  <g stroke="#5a78f2" fill="none">
    <circle cx="1040" cy="300" r="74" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="1040" cy="300" r="130" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="1040" cy="300" r="188" stroke-opacity="0.05" stroke-width="1.5"/>
  </g>
  <circle cx="1040" cy="300" r="5" fill="#5a78f2"/>
  <circle cx="1095" cy="252" r="4" fill="#fbbf24"/>
  <circle cx="962" cy="356" r="4" fill="#38bdf8"/>

  <rect x="0" y="0" width="8" height="630" fill="#2c3ee5"/>

  <!-- header: brand mark + name -->
  <rect x="80" y="64" width="56" height="56" rx="13" fill="#2c3ee5"/>
  <text x="108" y="102" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">PJ</text>
  <text x="152" y="92" font-size="27" font-weight="800" letter-spacing="0.5" fill="#ffffff">pranithjain.qzz.io</text>
  <text x="153" y="116" font-size="13" font-weight="700" letter-spacing="3" fill="#a1b6fb">BUILT ON CLOUDFLARE WORKERS</text>

  <!-- live indicator pill (top-right) -->
  <g>
    <rect x="1016" y="66" width="104" height="36" rx="18" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1040" cy="84" r="5.5" fill="#34d399"/>
    <circle cx="1040" cy="84" r="9" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="1056" y="90" font-size="15" font-weight="800" letter-spacing="2.5" fill="#6ee7b7">LIVE</text>
  </g>

  <!-- section eyebrow -->
  <text x="80" y="208" font-size="18" font-weight="800" letter-spacing="4" fill="#a1b6fb">ARGUS · THREAT NEXUS</text>

  <!-- headline -->
  <text x="80" y="286" font-size="58" font-weight="800" letter-spacing="0.3" fill="#ffffff">Nation-state threat intel</text>
  <text x="80" y="356" font-size="58" font-weight="800" letter-spacing="0.3" fill="#a1b6fb">with 3D globe visualization</text>

  <!-- features -->
  <text x="80" y="448" font-size="22" font-weight="400" fill="#cbd5e1">Actor dossiers · relationship graphs · live feeds</text>

  <!-- divider -->
  <rect x="80" y="486" width="120" height="4" rx="2" fill="#5a78f2"/>

  <!-- stats -->
  <text x="80" y="528" font-size="42" font-weight="800" fill="#a1b6fb">6</text>
  <text x="80" y="556" font-size="15" font-weight="600" letter-spacing="2" fill="#94a3b8">VIEWS</text>
  <text x="330" y="528" font-size="42" font-weight="800" fill="#a1b6fb">APT</text>
  <text x="330" y="556" font-size="15" font-weight="600" letter-spacing="2" fill="#94a3b8">DATA</text>
  <text x="580" y="528" font-size="42" font-weight="800" fill="#a1b6fb">interactive</text>
  <text x="580" y="556" font-size="15" font-weight="600" letter-spacing="2" fill="#94a3b8">VISUAL</text>

  <!-- footer -->
  <text x="80" y="600" font-size="20" font-weight="700" letter-spacing="0.5" fill="#94a3b8"><tspan fill="#a1b6fb" font-weight="800">pranithjain.qzz.io/threatnexus  ·  standalone</tspan></text>
</svg>